<!doctype html>
<!--
  CropGuard AI Engine - דף בדיקה פשוט.
  מעלים תמונה של עלה, הדף שולח אותה ל-POST /predict ומציג את התוצאה בגדול.
  הכול בקובץ אחד (HTML + CSS + JS), בלי ספריות חיצוניות.
-->
<html lang="he" dir="rtl">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>CropGuard - בדיקת עלה</title>
  <style>
    /* צבעים כמשתנים, כדי שמצב כהה יחליף רק אותם */
    :root {
      --bg: #f3f6f1;
      --card: #ffffff;
      --text: #1d2a1f;
      --muted: #5d6b5f;
      --border: #d7e0d4;
      --brand: #2e7d32;
      --brand-soft: #e3f1e4;
      --healthy: #2e7d32;
      --healthy-soft: #e3f1e4;
      --infected: #c62828;
      --infected-soft: #fbe5e5;
      --warn: #8a5a00;
      --warn-soft: #fff3d6;
      --bar: #dfe7dc;
    }
    @media (prefers-color-scheme: dark) {
      :root {
        --bg: #121812;
        --card: #1b231b;
        --text: #e6eee5;
        --muted: #9fae9f;
        --border: #2f3b2f;
        --brand: #66bb6a;
        --brand-soft: #1f3321;
        --healthy: #66bb6a;
        --healthy-soft: #1f3321;
        --infected: #ef5350;
        --infected-soft: #3a1d1d;
        --warn: #ffca63;
        --warn-soft: #3a2f14;
        --bar: #2a352a;
      }
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      background: var(--bg);
      color: var(--text);
      font-family: "Segoe UI", Arial, sans-serif;
      line-height: 1.5;
    }
    main { max-width: 640px; margin: 0 auto; padding: 24px 16px 48px; }
    header { display: flex; align-items: center; justify-content: space-between; gap: 12px; margin-bottom: 20px; }
    h1 { font-size: 1.6rem; margin: 0; color: var(--brand); }
    .subtitle { margin: 4px 0 0; color: var(--muted); font-size: 0.95rem; }
    .status { font-size: 0.85rem; padding: 4px 10px; border-radius: 999px; background: var(--bar); color: var(--muted); white-space: nowrap; }
    .status.ok { background: var(--healthy-soft); color: var(--healthy); }
    .status.bad { background: var(--infected-soft); color: var(--infected); }
    .card { background: var(--card); border: 1px solid var(--border); border-radius: 14px; padding: 20px; margin-bottom: 16px; }

    /* אזור ההעלאה: לחיצה או גרירת קובץ */
    .drop {
      display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 8px;
      min-height: 180px; border: 2px dashed var(--border); border-radius: 12px; cursor: pointer;
      text-align: center; padding: 16px; color: var(--muted); transition: border-color .15s, background .15s;
    }
    .drop:hover, .drop.dragging { border-color: var(--brand); background: var(--brand-soft); }
    .drop strong { color: var(--text); font-size: 1.05rem; }
    .drop img { max-width: 100%; max-height: 260px; border-radius: 8px; }
    input[type=file] { display: none; }
    button {
      width: 100%; margin-top: 14px; padding: 12px; font-size: 1.05rem; font-weight: 600;
      border: none; border-radius: 10px; background: var(--brand); color: #fff; cursor: pointer;
    }
    button:disabled { opacity: .5; cursor: default; }

    /* כרטיס התוצאה */
    .result.healthy { border-color: var(--healthy); }
    .result.infected { border-color: var(--infected); }
    .badge { display: inline-block; padding: 4px 12px; border-radius: 999px; font-weight: 700; font-size: 0.9rem; }
    .badge.healthy { background: var(--healthy-soft); color: var(--healthy); }
    .badge.infected { background: var(--infected-soft); color: var(--infected); }
    .disease { font-size: 1.5rem; font-weight: 700; margin: 10px 0 2px; }
    .english { color: var(--muted); font-size: 0.9rem; direction: ltr; text-align: right; margin: 0; }
    .confidence-row { display: flex; justify-content: space-between; margin-top: 16px; font-weight: 600; }
    .bar { height: 10px; background: var(--bar); border-radius: 999px; overflow: hidden; margin-top: 6px; }
    .bar > span { display: block; height: 100%; border-radius: 999px; background: var(--brand); }
    .result.infected .bar.main > span { background: var(--infected); }
    .warning { margin-top: 14px; padding: 10px 12px; border-radius: 10px; background: var(--warn-soft); color: var(--warn); font-size: 0.92rem; }
    h2 { font-size: 1rem; margin: 20px 0 8px; color: var(--muted); }
    .alt { margin-bottom: 10px; }
    .alt .row { display: flex; justify-content: space-between; gap: 8px; font-size: 0.95rem; }
    .alt .bar { height: 6px; margin-top: 4px; }
    .alt .bar > span { background: var(--muted); }
    .error { border-color: var(--infected); color: var(--infected); }
    .footer { text-align: center; color: var(--muted); font-size: 0.85rem; }
    .footer a { color: var(--brand); }
    [hidden] { display: none !important; }
  </style>
</head>
<body>
  <main>
    <header>
      <div>
        <h1>🌿 CropGuard</h1>
        <p class="subtitle">העלו תמונה של עלה ובדקו אם הוא בריא או נגוע</p>
      </div>
      <span id="status" class="status">בודק חיבור...</span>
    </header>

    <section class="card">
      <label id="drop" class="drop" for="file">
        <span id="drop-text"><strong>לחצו לבחירת תמונה</strong><br>או גררו לכאן קובץ <bdi dir="ltr">(JPG, PNG, WebP)</bdi></span>
        <img id="preview" alt="התמונה שנבחרה" hidden>
      </label>
      <input id="file" type="file" accept="image/*">
      <button id="submit" type="button" disabled>בדיקת העלה</button>
    </section>

    <section id="error" class="card error" hidden></section>

    <section id="result" class="card result" hidden>
      <span id="badge" class="badge"></span>
      <p id="disease" class="disease"></p>
      <p id="english" class="english"></p>
      <div class="confidence-row"><span>ודאות</span><span id="percent"></span></div>
      <div class="bar main"><span id="bar"></span></div>
      <div id="uncertain" class="warning" hidden>
        הוודאות נמוכה. כדאי לצלם שוב עלה בודד, מקרוב ובתאורה טובה, או להתייעץ עם מומחה.
      </div>
      <h2>אפשרויות נוספות שהמודל שקל</h2>
      <div id="alternatives"></div>
    </section>

    <p class="footer">
      התוצאה היא הערכה של מודל ולא אבחנה סופית ·
      <a href="/docs">תיעוד ה-API</a>
    </p>
  </main>

  <script>
    // שמות בעברית לכל 38 התוויות של המודל (המפתח הוא התווית מ-labels-38.txt)
    const HEBREW_NAMES = {
      "Apple___Apple_scab": "תפוח – גרב התפוח",
      "Apple___Black_rot": "תפוח – ריקבון שחור",
      "Apple___Cedar_apple_rust": "תפוח – חלדון ארז-תפוח",
      "Apple___Healthy": "תפוח – בריא",
      "Blueberry___Healthy": "אוכמנית – בריא",
      "Cherry___Powdery_mildew": "דובדבן – קימחון",
      "Cherry___Healthy": "דובדבן – בריא",
      "Corn___Cercospora_leaf_spot Gray_leaf_spot": "תירס – כתמת עלים אפורה (צרקוספורה)",
      "Corn___Common_rust": "תירס – חלדון מצוי",
      "Corn___Northern_Leaf_Blight": "תירס – כתמת עלים צפונית",
      "Corn___Healthy": "תירס – בריא",
      "Grape___Black_rot": "גפן – ריקבון שחור",
      "Grape___Esca_(Black_Measles)": "גפן – אסקה (חצבת שחורה)",
      "Grape___Leaf_blight_(Isariopsis_Leaf_Spot)": "גפן – כתמת עלים (איזריופסיס)",
      "Grape___Healthy": "גפן – בריא",
      "Orange___Haunglongbing_(Citrus_greening)": "תפוז – ירוקת ההדרים (HLB)",
      "Peach___Bacterial_spot": "אפרסק – כתמת חיידקית",
      "Peach___Healthy": "אפרסק – בריא",
      "Pepper,_bell___Bacterial_spot": "פלפל – כתמת חיידקית",
      "Pepper,_bell___Healthy": "פלפל – בריא",
      "Potato___Early_blight": "תפוח אדמה – כתמת עלים מוקדמת (אלטרנריה)",
      "Potato___Late_blight": "תפוח אדמה – כימשון",
      "Potato___Healthy": "תפוח אדמה – בריא",
      "Raspberry___Healthy": "פטל – בריא",
      "Soybean___Healthy": "סויה – בריא",
      "Squash___Powdery_mildew": "דלעת – קימחון",
      "Strawberry___Leaf_scorch": "תות שדה – חריכת עלים",
      "Strawberry___Healthy": "תות שדה – בריא",
      "Tomato___Bacterial_spot": "עגבנייה – כתמת חיידקית",
      "Tomato___Early_blight": "עגבנייה – כתמת עלים מוקדמת (אלטרנריה)",
      "Tomato___Late_blight": "עגבנייה – כימשון",
      "Tomato___Leaf_Mold": "עגבנייה – עובש עלים",
      "Tomato___Septoria_leaf_spot": "עגבנייה – כתמת ספטוריה",
      "Tomato___Spider_mites Two-spotted_spider_mite": "עגבנייה – אקרית אדומה מצויה",
      "Tomato___Target_Spot": "עגבנייה – כתמת מטרה",
      "Tomato___Tomato_Yellow_Leaf_Curl_Virus": "עגבנייה – וירוס צהבון אמיר העגבנייה (TYLCV)",
      "Tomato___Tomato_mosaic_virus": "עגבנייה – וירוס מוזאיקת העגבנייה",
      "Tomato___Healthy": "עגבנייה – בריא",
    };

    // הסבר בעברית לכל קוד שגיאה שהשרת מחזיר
    const ERROR_MESSAGES = {
      bad_request: "הקובץ לא נקרא כתמונה תקינה. נסו תמונה אחרת.",
      payload_too_large: "הקובץ גדול מדי (עד 10MB).",
      unsupported_media_type: "הקובץ שנבחר אינו תמונה.",
      validation_error: "לא נשלחה תמונה.",
      model_unavailable: "המודל לא נטען בשרת. בדקו את הלוג של השרת.",
      internal_error: "אירעה שגיאה בשרת בזמן הבדיקה.",
    };

    const $ = (id) => document.getElementById(id);
    const hebrewName = (label, fallback) => HEBREW_NAMES[label] ?? fallback;
    let selectedFile = null;

    // מצב השרת בפינה העליונה
    fetch("/health")
      .then((response) => response.json())
      .then((health) => {
        const ok = health.status === "ok";
        $("status").textContent = ok ? "המודל מוכן" : "המודל לא נטען";
        $("status").className = "status " + (ok ? "ok" : "bad");
      })
      .catch(() => {
        $("status").textContent = "אין חיבור לשרת";
        $("status").className = "status bad";
      });

    // בחירת קובץ: מציגים תצוגה מקדימה ומאפשרים את הכפתור
    function selectFile(file) {
      if (!file) return;
      // קובץ שברור שאינו תמונה נדחה מיד, בלי לשלוח אותו לשרת
      if (file.type && !file.type.startsWith("image/")) {
        selectedFile = null;
        $("preview").hidden = true;
        $("drop-text").hidden = false;
        $("submit").disabled = true;
        showError(ERROR_MESSAGES.unsupported_media_type);
        return;
      }
      selectedFile = file;
      $("preview").src = URL.createObjectURL(file);
      $("preview").hidden = false;
      $("drop-text").hidden = true;
      $("submit").disabled = false;
      $("result").hidden = true;
      $("error").hidden = true;
    }

    $("file").addEventListener("change", (event) => selectFile(event.target.files[0]));

    // גרירת קובץ לאזור ההעלאה
    const drop = $("drop");
    drop.addEventListener("dragover", (event) => { event.preventDefault(); drop.classList.add("dragging"); });
    drop.addEventListener("dragleave", () => drop.classList.remove("dragging"));
    drop.addEventListener("drop", (event) => {
      event.preventDefault();
      drop.classList.remove("dragging");
      selectFile(event.dataTransfer.files[0]);
    });

    function showError(text) {
      $("error").textContent = text;
      $("error").hidden = false;
      $("result").hidden = true;
    }

    function showResult(data) {
      const state = data.is_healthy ? "healthy" : "infected";
      $("result").className = "card result " + state;
      $("badge").className = "badge " + state;
      $("badge").textContent = data.is_healthy ? "✓ בריא" : "⚠ נגוע";
      $("disease").textContent = hebrewName(data.model_label, data.disease);
      $("english").textContent = data.disease;
      $("percent").textContent = data.confidence_percent.toFixed(1) + "%";
      $("bar").style.width = data.confidence_percent + "%";
      $("uncertain").hidden = !data.uncertain;

      // שאר האפשרויות (בלי הראשונה, שכבר מוצגת למעלה)
      const list = $("alternatives");
      list.replaceChildren();
      for (const option of data.top_predictions.slice(1)) {
        const percent = option.confidence * 100;
        const item = document.createElement("div");
        item.className = "alt";
        const row = document.createElement("div");
        row.className = "row";
        const name = document.createElement("span");
        name.textContent = hebrewName(option.model_label, option.disease);
        const value = document.createElement("span");
        value.textContent = percent.toFixed(1) + "%";
        row.append(name, value);
        const bar = document.createElement("div");
        bar.className = "bar";
        const fill = document.createElement("span");
        fill.style.width = percent + "%";
        bar.append(fill);
        item.append(row, bar);
        list.append(item);
      }

      $("result").hidden = false;
      $("error").hidden = true;
      $("result").scrollIntoView({ behavior: "smooth", block: "start" });
    }

    // שליחת התמונה לשרת
    $("submit").addEventListener("click", async () => {
      if (!selectedFile) return;
      const button = $("submit");
      button.disabled = true;
      button.textContent = "בודק...";
      try {
        const form = new FormData();
        form.append("image", selectedFile);
        const response = await fetch("/predict", { method: "POST", body: form });
        const data = await response.json();
        if (response.ok) {
          showResult(data);
        } else {
          showError(ERROR_MESSAGES[data.error] ?? data.detail ?? "שגיאה לא ידועה");
        }
      } catch {
        showError("אין חיבור לשרת. ודאו שהשרת רץ (npm run dev:ai).");
      } finally {
        button.disabled = false;
        button.textContent = "בדיקת העלה";
      }
    });
  </script>
</body>
</html>
